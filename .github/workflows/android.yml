name: Android Mobile APK

on:
  push:
    branches:
      - main
      - mobile-android-v1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          ZIP=/tmp/commandlinetools.zip
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" -o "$ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $ZIP" | sha256sum -c -
          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q "$ZIP" -d /tmp/android-cmdline
          cp -R /tmp/android-cmdline/cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate Python tooling syntax
        run: python3 -m py_compile tools/*.py

      - name: Unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
