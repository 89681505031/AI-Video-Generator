name: Mobile Lite Model Assets

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-android-v1
    paths:
      - "tools/generate_null_condition.py"
      - ".github/workflows/mobile-lite-assets.yml"

jobs:
  null-condition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU inference dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install transformers==4.46.3 safetensors==0.4.5 numpy==1.26.4

      - name: Generate official empty-prompt conditioning
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python tools/generate_null_condition.py

      - name: Verify exact size
        shell: bash
        run: |
          test "$(stat -c%s build/mobile-lite-assets/null_condition.bin)" = "537600"
          sha256sum build/mobile-lite-assets/null_condition.bin
          cat build/mobile-lite-assets/null_condition.info.json

      - name: Upload Lite asset
        uses: actions/upload-artifact@v4
        with:
          name: mobilei2v-null-condition
          path: |
            build/mobile-lite-assets/null_condition.bin
            build/mobile-lite-assets/null_condition.info.json
          if-no-files-found: error
